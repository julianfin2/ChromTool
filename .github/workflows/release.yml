name: Chrom Tool Multi-Platform Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_targets: msi
            archive_suffix: windows-x64
            built_app_path: src-tauri/target/release/ChromTool.exe
            installer_path: src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            bundle_targets: app,dmg
            archive_suffix: macos-arm64
            built_app_path: src-tauri/target/release/bundle/macos/ChromTool.app
            installer_path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            bundle_targets: app,dmg
            archive_suffix: macos-x64
            built_app_path: src-tauri/target/release/bundle/macos/ChromTool.app
            installer_path: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install 7-Zip on macOS
        if: runner.os == 'macOS'
        run: brew install p7zip

      - name: Build Tauri app
        run: pnpm tauri build --bundles ${{ matrix.bundle_targets }}

      - name: Create archive directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

      - name: Archive built app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archivePath = Join-Path $PWD "release-artifacts/ChromTool-$env:RELEASE_TAG-${{ matrix.archive_suffix }}.7z"
          $sourcePath = Join-Path $PWD "${{ matrix.built_app_path }}"
          $sourceDir = Split-Path -Path $sourcePath -Parent
          $sourceName = Split-Path -Path $sourcePath -Leaf

          Push-Location $sourceDir
          try {
            7z a $archivePath $sourceName
          }
          finally {
            Pop-Location
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.archive_suffix }}-release-assets
          path: |
            release-artifacts/ChromTool-${{ github.ref_name }}-${{ matrix.archive_suffix }}.7z
            ${{ matrix.installer_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: artifacts/**/*

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
